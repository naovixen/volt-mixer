# Builds the desktop app on each system when a v* tag is pushed, then attaches the installers to
# the tag's draft GitHub Release, with notes written from the commits since the last tag. Read
# and edit the notes, then publish the draft by hand once it's been tried. Builds are unsigned.
# The builds and the notes can only read the repository; only the last job, which runs no project
# code, can write to releases. Actions are pinned to a commit; the comment says which release.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check the tag matches the app's version
        if: github.event_name == 'push'
        shell: bash
        run: |
          version="v$(node -p "require('./desktop/package.json').version")"
          if [ "$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::The tag is $GITHUB_REF_NAME but desktop/package.json says $version."
            exit 1
          fi
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm install --frozen-lockfile
        working-directory: desktop
      - run: pnpm dist
        working-directory: desktop
      - name: Check the macOS app is signed (ad hoc), or Apple silicon won't open it
        if: runner.os == 'macOS'
        run: codesign -dv "desktop/release/mac-arm64/Volt Mixer.app"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: volt-mixer-${{ matrix.os }}
          path: |
            desktop/release/*.exe
            desktop/release/*.dmg
            desktop/release/*.AppImage
            desktop/release/*.deb
          if-no-files-found: error

  # The draft's notes, from the Conventional Commits since the previous v* tag (it needs the
  # whole history and the tags to find them).
  notes:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - run: node .github/scripts/release-notes.mjs "$GITHUB_REF_NAME" > release-notes.md
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-notes
          path: release-notes.md
          if-no-files-found: error

  # A tag's installers go to its draft release, named for the version (as electron-builder did).
  # The notes are only used when the draft is made, so a re-run keeps any edits to them.
  # A manual run stops at the build, and keeps the files as artefacts.
  publish:
    if: github.event_name == 'push'
    needs: [build, notes]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: volt-mixer-*
          path: release
          merge-multiple: true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-notes
          path: notes
      - name: Attach the installers to the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          is_draft="$(gh release view "$TAG" --json isDraft --jq .isDraft 2>/dev/null || echo none)"
          if [ "$is_draft" = none ]; then
            gh release create "$TAG" --draft --verify-tag --title "${TAG#v}" --notes-file notes/release-notes.md
          elif [ "$is_draft" = false ]; then
            echo "::error::$TAG is already published; its files are left as they are."
            exit 1
          fi
          gh release upload "$TAG" release/* --clobber
