# Unsigned builds. .github/workflows/release.yml attaches them to a draft GitHub Release, so
# electron-builder itself never publishes (publish: null). The repository and homepage come from
# package.json.
appId: io.github.naovixen.voltmixer
productName: Volt Mixer
copyright: Copyright © 2026 Naomi
directories:
  output: release
  buildResources: build
# The site is packed in app.asar with main's code, so the asar integrity check covers it too
# (src/site-files.ts).
files:
  - out/**
  - site/**
  - package.json
# node-hid's prebuilt binaries use Node-API, which Electron loads as they are; rebuilding them
# would need a compiler on every release runner.
npmRebuild: false
# The tray icons sit beside the app, as files the system's tray can open (iconPath in src/tray.ts).
extraResources:
  - from: build/tray.png
    to: tray.png
  - from: build/trayTemplate.png
    to: trayTemplate.png
  - from: build/trayTemplate@2x.png
    to: trayTemplate@2x.png
electronFuses:
  runAsNode: false
  enableCookieEncryption: true
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  enableEmbeddedAsarIntegrityValidation: true
  onlyLoadAppFromAsar: true
  # Nothing loads from file://, so it gets no more than any other scheme.
  grantFileProtocolExtraPrivileges: false
win:
  target: nsis
  icon: build/icon.png
nsis:
  artifactName: Volt-Mixer-Setup-${version}.${ext}
mac:
  target:
    - target: dmg
      arch: [arm64, x64]
  category: public.app-category.music
  icon: build/icon.png
  # Ad hoc: Apple silicon won't open an unsigned app at all. Not notarised, so Gatekeeper asks once.
  identity: "-"
  hardenedRuntime: false
  notarize: false
dmg:
  artifactName: Volt-Mixer-${version}-${arch}.${ext}
linux:
  target: [AppImage, deb]
  # A .deb must name a maintainer with an email: GitHub's no-reply address, as on the commits.
  maintainer: Naomi <65184830+naovixen@users.noreply.github.com>
  category: AudioVideo
  icon: build/icon.png
  artifactName: Volt-Mixer-${version}-${arch}.${ext}
# Written by scripts/linux-scripts.mjs (pnpm dist): electron-builder's own scripts plus the udev rule.
deb:
  afterInstall: build/linux/after-install.sh
  afterRemove: build/linux/after-remove.sh
publish: null
